name: Maven Build

on:
  push:
  pull_request:
  # dynamic-form dispatches this after publishing a new api jar, testcontainers jar and image
  repository_dispatch:
    types: [dynamic-form-built]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # SnapFX is not on Maven Central. The install-snapfx profile in pom.xml downloads it from its
      # GitHub release and installs it into the local repository. This needs its own invocation:
      # Maven resolves a project's dependencies before it runs any phase, so a profile bound to
      # initialize cannot repair a missing dependency inside the same `mvn verify`.
      - name: Install SnapFX into the local repository
        run: mvn -B initialize

      # No GHCR login: ghcr.io/markoniemi/dynamic-form is public now (verified 2026-10-24 — an
      # anonymous pull token is issued and the manifest fetches), so Testcontainers pulls it
      # unauthenticated. The login step that used to be here also failed every pull request from a
      # fork, where the secret it read is empty.
      - name: Build and test
        run: mvn -B clean verify
